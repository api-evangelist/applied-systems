    type: Documentation
  - url: https://endgrate.com/blog/how-to-get-policies-with-the-applied-epic-api-in-javascript
    type: IntegrationGuide
  description: >-
    Retrieve the policies attached to an Epic client. Confirmed endpoint
    GET /policy/v1/clients/{clientId}/policies is documented in third-party
    integration guides, returning coverage records for a given client over
    OAuth 2.0 Bearer authentication.
