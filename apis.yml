  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://devcenter.myappliedproducts.com/docs/overview
  baseURL: https://api.myappliedproducts.com/policy/v1
  endpointsModeled: false
  properties:
