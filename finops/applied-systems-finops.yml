meters:
- name: epic_subscription
  description: Applied Epic license cost, typically scaled by users and modules; API access is bundled here.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - module
- name: connector_fees
  description: Per-integration connector or marketplace fees for specific pre-built integrations.
  unit: integrations
  aggregation: sum
  dimensions:
  - account
  - integration
- name: partner_certification
  description: Certified integration partner program costs for vendors building on Applied Epic.
  unit: agreements
  aggregation: sum
  dimensions:
  - partner
principles:
- name: Visibility
  description: Track Applied Epic seats, modules, and each connector/integration fee; there is no per-call API meter to monitor.
- name: Allocation
  description: Map Applied Epic modules and integrations to the teams and workflows that consume them.
- name: Optimization
  description: Right-size Epic seats/modules, consolidate integrations, and request least-privilege OAuth scopes to limit exposure and avoid over-purchasing.
- name: Accountability
  description: Assign an owner for the Applied contract and review license, connector, and partner-certification spend on the annual renewal cycle.
