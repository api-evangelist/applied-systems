apis:
- aid: applied-systems:applied-systems-clients-api
  name: Applied Epic Clients (CRM) API
  tags:
  - Clients
  - Account
  - CRM
  tags_raw:
  - Clients
  - Accounts
  - CRM
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://devcenter.myappliedproducts.com/docs/overview
  baseURL: https://api.myappliedproducts.com/crm/v1
  endpointsModeled: false
  properties:
  - url: https://devcenter.myappliedproducts.com/docs/overview
    type: Documentation
  - url: https://www1.appliedsystems.com/en-us/blog/posts/applied-epic-api-insurance-software-integration/
    type: BlogPost
  description: >-
    Read Applied Epic client (account) records - client lookup, benefits data
    such as employee counts and HIPAA compliance, and identifiers used for VoIP
    caller identification. Confirmed endpoint GET /crm/v1/clients is documented
    in third-party integration guides. OAuth scopes include epic/clients:read
    and epic/clients:all.
- aid: applied-systems:applied-systems-policies-api
  name: Applied Epic Policies API
  tags:
