description: >-
  FinOps view of Applied Systems developer-platform spend. There is no
  standalone, usage-metered API invoice from Applied. API access is bundled into
  the Applied Epic license and any certified-partner agreement, so the dominant
  cost drivers are the Applied Epic subscription itself (custom, quote-based,
  scaling with users, modules, and integration requirements), implementation and
  data-migration services, and per-integration connector fees rather than
  per-call API charges. The developer sandbox is free; production access is
  approval-gated and tied to an active Applied Epic tenancy.
notes: >-
  Applied does not publish API meters or per-unit rates. Treat cost management
  as license and contract management: track Applied Epic seats/modules,
  connector fees, and partner-certification costs. Verify all figures directly
  with Applied Systems during reconciliation.
