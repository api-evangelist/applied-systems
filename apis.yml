aid: applied-systems
url: https://raw.githubusercontent.com/api-evangelist/applied-systems/refs/heads/main/apis.yml
name: Applied Systems
kind: company
description: >-
  Applied Systems is a leading global provider of cloud-based software for the
  business of insurance, best known for the Applied Epic agency management
  system (plus TAM, Applied CSR24, and related products). Applied exposes a
  RESTful developer platform for Applied Epic through the Applied Dev Center at
  devcenter.myappliedproducts.com, superseding the older Applied Epic SDK. The
  APIs let certified partners and agencies read and write core Epic data -
  clients/accounts, policies, contacts, attachments, and activities - over
  OAuth 2.0. Access is gated: developers register, build and test an app against
  a sandbox, then submit a production request (name, email, organization,
  enterprise ID, and Epic database name) that Applied must approve before
  production credentials are issued. Base URL for the platform is
  https://api.myappliedproducts.com.
