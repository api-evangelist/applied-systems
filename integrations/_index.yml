  evidence: https://cloudsecurityalliance.org/star/registry/applied-systems/services/applied-systems
  source: edge
  relationship: standard-participant
  contract_reference:
    register: CSA STAR Registry (cloudsecurityalliance.org/star/registry)
    spec_file: null
    standard: CSA STAR
    role: star-level-1
    registered_name: Applied Systems
    registry_id: applied-systems
    service_url: https://www1.appliedsystems.com/
    matched_domain: appliedsystems.com
    matched_by: domain
    identity_source: the service URL the organisation filed on its STAR listing (no lookup)
    levels:
    - STAR Level 1
    certified_products: []
    signal_note: STAR Level 1 (CAIQ self-assessment) = participation; certified_products = one entry per STAR Level
