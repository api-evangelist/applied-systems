actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on Applied's own API, and the Applied
    Epic developer platform is request/response REST secured with OAuth 2.0. No
    AsyncAPI document was created because there is no documented server-push
    transport to model.
